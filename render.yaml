services:
  - type: web
    name: callmissed-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: pytest tests/
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CALLMISSED_MOCK_MODE
        value: "false"
      - key: CALLMISSED_API_KEY
        sync: false
